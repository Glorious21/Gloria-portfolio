  <!--
    Theme Init — runs SYNCHRONOUSLY before any rendering.
    Default is LIGHT. Toggle saves preference to localStorage.
  -->
  <script>
    (function () {
      var saved = '';
      try { saved = localStorage.getItem('theme') || ''; } catch (e) {}
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        // 'light' or no preference → light mode (default)
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
